{% extends "base.html" %}

{% block title %}Criar conta | StudyRoom{% endblock %}

{% block conteudo %}

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-logo">
                StudyRoom 📚
            </div>

            <h1>
                Criar sua conta
            </h1>

            <p class="auth-description">
                Crie sua conta e comece a estudar com outras pessoas.
            </p>

            <form method="POST" action="{{ url_for('cadastro') }}">

                <div class="form-group">

                    <label for="nome">
                        Nome
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Crie uma senha"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmar_senha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmar_senha"
                        name="confirmar_senha"
                        placeholder="Digite a senha novamente"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="auth-button">

                    Criar conta

                </button>

            </form>

            <p class="auth-footer">

                Já possui uma conta?

                <a href="{{ url_for('login') }}">
                    Entrar
                </a>

            </p>

        </section>

    </main>

{% endblock %}
