<!-- ==========================================
     STUDYROOM - LISTAGEM DE TRILHAS
========================================== -->

<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trilhas de Aprendizagem | StudyRoom</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <main>

        <h1>Trilhas de Aprendizagem</h1>

        <!-- ==========================================
             LISTA DE TRILHAS
        =========================================== -->

        <!-- Percorre cada trilha da lista "trilhas" -->
        {% for trilha in trilhas %}

            <section>

                <!-- trilha[1] é o título -->
                <h2>{{ trilha[1] }}</h2>

                <!-- trilha[2] é a descrição -->
                <p>{{ trilha[2] }}</p>

                <!-- trilha[3] é o nível -->
                <p>Nível: {{ trilha[3] }}</p>

                <!--
                    Link para a página de detalhes dessa trilha.
                    trilha[0] é o id, usado para montar a URL
                    dinamicamente: /trilha/1, /trilha/2, etc.
                -->
                <a href="{{ url_for('trilha', trilha_id=trilha[0]) }}">
                    Ver trilha
                </a>

            </section>

        {% endfor %}

    </main>

</body>

</html>
