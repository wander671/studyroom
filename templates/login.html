{% extends "base.html" %}

{% block title %}Entrar | StudyRoom{% endblock %}

{% block conteudo %}

    <main class="auth-container">

        <section class="auth-card">

            <div class="auth-logo">
                StudyRoom 📚
            </div>

            <h1>
                Bem-vindo de volta!
            </h1>

            <p class="auth-description">
                Entre na sua conta e continue estudando.
            </p>

            <form method="POST" action="{{ url_for('login') }}">

                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="auth-button">

                    Entrar

                </button>

            </form>

            <p class="auth-footer">

                Não tem uma conta?

                <a href="{{ url_for('cadastro') }}">
                    Criar conta
                </a>

            </p>

        </section>

    </main>

{% endblock %}
