<!-- ==========================================
     STUDYROOM - PÁGINA DE LOGIN
========================================== -->

<!DOCTYPE html>

<!-- Define o idioma da página -->
<html lang="pt-BR">

<head>

    <!-- ==========================================
         CONFIGURAÇÕES DA PÁGINA
    =========================================== -->

    <!-- Permite caracteres especiais -->
    <meta charset="UTF-8">

    <!-- Responsividade -->
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <!-- Título da página -->
    <title>Entrar | StudyRoom</title>


    <!-- ==========================================
         ARQUIVO CSS
    =========================================== -->

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- ==========================================
         ÁREA PRINCIPAL DO LOGIN
    =========================================== -->

    <main class="auth-container">

        <!-- ==========================================
             CARD DE LOGIN
        =========================================== -->

        <section class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                StudyRoom 📚
            </div>


            <!-- Título -->
            <h1>
                Bem-vindo de volta!
            </h1>


            <!-- Descrição -->
            <p class="auth-description">
                Entre na sua conta e continue estudando.
            </p>


            <!-- ==========================================
                 FORMULÁRIO DE LOGIN
            =========================================== -->

            <form>

                <!-- Campo de e-mail -->
                <div class="form-group">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>


                <!-- Campo de senha -->
                <div class="form-group">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required
                    >

                </div>


                <!-- Botão de login -->
                <button
                    type="submit"
                    class="auth-button">

                    Entrar

                </button>

            </form>


            <!-- ==========================================
                 LINK PARA CADASTRO
            =========================================== -->

            <p class="auth-footer">

                Ainda não possui uma conta?

                <a href="{{ url_for('cadastro') }}">
                    Criar conta
                </a>

            </p>

        </section>

    </main>

</body>

</html>
